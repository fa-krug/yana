name: Yana

options:
  bundleIdPrefix: de.fa-krug
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - de
    - Base
  fileTypes:
    icon:
      file: true

settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HS26J3YA63
    # Only reaches the four test targets: every INFOPLIST_KEY_* setting is ignored under
    # GENERATE_INFOPLIST_FILE: false, which both app targets set, so the app bundles carry these
    # keys literally in Info-iOS.plist / Info-macOS.plist instead. Keep the three copies in step.
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Sascha Krug. All rights reserved."
    VERSIONING_SYSTEM: apple-generic
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
  configs:
    Release:
      ENABLE_TESTABILITY: false

targets:
  Yana:
    type: application
    platform: iOS
    sources:
      - path: Yana
        excludes:
          - "Info-iOS.plist"
          - "Info-macOS.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Yana
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Yana/Entitlements/Yana-iOS.entitlements
        INFOPLIST_FILE: Yana/Info-iOS.plist
        GENERATE_INFOPLIST_FILE: false
        # 1 = iPhone, 2 = iPad. The Mac build is a separate native target (Yana-macOS),
        # not family 6 / Mac Catalyst any more.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Yana uses Face ID to protect your reading data."

  Yana-macOS:
    type: application
    platform: macOS
    sources:
      - path: Yana
        excludes:
          - "Info-iOS.plist"
          - "Info-macOS.plist"
    settings:
      base:
        # Both targets produce "Yana.app"; there is no collision because each platform
        # has its own BUILT_PRODUCTS_DIR. The bundle identifier is deliberately identical
        # to the iOS target's: that is what keeps the Keychain access group shared.
        PRODUCT_NAME: Yana
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Yana
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Yana/Entitlements/Yana-macOS.entitlements
        INFOPLIST_FILE: Yana/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  YanaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YanaTests
    dependencies:
      - target: Yana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Yana.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yana.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Yana"
        BUNDLE_LOADER: "$(TEST_HOST)"

  YanaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YanaUITests
    dependencies:
      - target: Yana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Yana.uitests
        GENERATE_INFOPLIST_FILE: true

  YanaTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: YanaTests
    dependencies:
      - target: Yana-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Yana.tests.macos
        GENERATE_INFOPLIST_FILE: true
        # BUNDLE_EXECUTABLE_FOLDER_PATH expands to "Contents/MacOS" on macOS and to
        # nothing on iOS, so this one string works verbatim on both platforms.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yana.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Yana"
        BUNDLE_LOADER: "$(TEST_HOST)"

  YanaUITests-macOS:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: YanaUITests
    dependencies:
      - target: Yana-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.Yana.uitests.macos
        GENERATE_INFOPLIST_FILE: true

schemes:
  Yana:
    build:
      targets:
        Yana: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YanaTests
        - YanaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Yana-macOS:
    build:
      targets:
        Yana-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YanaTests-macOS
        - YanaUITests-macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
